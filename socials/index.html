<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anthony Santoro — Socials</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --text: #e5e5e5;
      --muted: #a3a3a3;
      --border: #262626;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #050510;
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .blob-container {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
      mix-blend-mode: screen;
      transition: transform 0.7s cubic-bezier(0.15, 0.85, 0.35, 1);
      will-change: transform;
    }

    .blob-1 { width: 600px; height: 600px; background: #1e3a8a; top: 5%; left: 10%; }
    .blob-2 { width: 700px; height: 700px; background: #4c1d95; top: 35%; left: 50%; }
    .blob-3 { width: 500px; height: 500px; background: #1e40af; top: 55%; left: 5%; }
    .blob-4 { width: 550px; height: 550px; background: #5b21b6; top: 15%; left: 65%; }

    .layout {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .profile-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 16px;
    }

    .profile-wrapper::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
      animation: spin 4s linear infinite;
      z-index: 0;
      filter: blur(8px);
      opacity: 0.85;
    }

    .profile-wrapper::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
      animation: spin 4s linear infinite;
      z-index: 1;
    }

    .profile-circle {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: transparent;
      z-index: 2;
      overflow: hidden;
    }

    .profile-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 50%;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .name-row {
      position: relative;
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #fff;
      margin: 0;
      line-height: 1.1;
    }

    .verified-icon {
      position: absolute;
      left: 100%;
      top: 11px;
      width: 18px;
      height: 18px;
      margin-left: 6px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(17, 17, 17, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .icon-placeholder {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
      /* Drop your image here later:
         background-image: url('twitter.png');
         background-size: cover;
         background-position: center;
      */
    }

    .nano {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
      background-image: url('https://raw.githubusercontent.com/anthonysantoro/anthonysantoro.github.io/refs/heads/main/socials/nano.jpg');
      background-size: cover;
      background-position: center;
    
    }

    
    .twitter {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
      background-image: url('https://raw.githubusercontent.com/anthonysantoro/anthonysantoro.github.io/refs/heads/main/pic.jpg');
      background-size: cover;
      background-position: center;
    
    }

    

    @media (max-width: 480px) {
      .container { max-width: 92%; }
      h1 { font-size: 1.65rem; }
      .verified-icon { top: 18px; }
    }
  </style>
</head>
<body>

  <div class="blob-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="layout">
    <div class="container">
      <div class="profile-wrapper">
        <div class="profile-circle">
          <img src="https://raw.githubusercontent.com/anthonysantoro/anthonysantoro.github.io/refs/heads/main/pic.jpg" alt="Anthony Santoro" />
        </div>
      </div>

      <div class="name-row">
        <h1>Anthony Santoro</h1>
        <img class="verified-icon" src="https://img.icons8.com/ios-glyphs/90/228BE6/verified-account--v2.png" alt="verified" />
      </div>

      <div class="links">
        <a href="https://x.com/realasantoro" target="_blank" rel="noopener" class="link-btn">
          <div class="icon-placeholder"></div>
          <span>Twitter / X</span>
        </a>

        <a href="https://www.linkedin.com/in/anthony-s-4a638727b/" target="_blank" rel="noopener" class="link-btn">
          <div class="icon-placeholder"></div>
          <span>LinkedIn</span>
        </a>

        <a href="https://www.youtube.com/@nicholasgoatifi" target="_blank" rel="noopener" class="link-btn">
          <div class="icon-placeholder"></div>
          <span>YouTube</span>
        </a>

        <a href="https://github.com/anthonysantoro" target="_blank" rel="noopener" class="link-btn">
          <div class="icon-placeholder"></div>
          <span>GitHub</span>
        </a>

        <a href="https://nanoei.ai" target="_blank" rel="noopener" class="link-btn">
          <div class="nano"></div>
          <span>nanoei.ai</span>
        </a>

        <a href="https://reddit.com/u/anthonysantoro" target="_blank" rel="noopener" class="link-btn">
          <div class="icon-placeholder"></div>
          <span>Reddit</span>
        </a>

        <a href="https://www.instagram.com/real.a.santoro" target="_blank" rel="noopener" class="link-btn">
          <div class="icon-placeholder"></div>
          <span>Instagram</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    const blobs = document.querySelectorAll('.blob');
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 50;
      const y = (e.clientY / window.innerHeight - 0.5) * 50;

      blobs.forEach((blob, i) => {
        const factor = (i + 1) * 0.35;
        blob.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
      });
    });
  </script>
</body>
</html>
